# Local environment for the Pix payment event pipeline.
# Conventions (service names, ports, topics, databases, env vars) are defined in
# docs/architecture.md. Usage and troubleshooting: infra/README.md.
#
#   docker compose up -d                          infrastructure only
#   docker compose --profile apps up -d --build   whole pipeline
#   docker compose --profile apps down -v         stop and reset everything

name: payments-kafka

x-consumer-env: &consumer-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  RETRY_MAX_ATTEMPTS: "4"
  RETRY_BACKOFF_MS: "1000"
  LOG_LEVEL: info

x-consumer-depends-on: &consumer-depends-on
  kafka:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy

# Java images are expected to contain curl or wget for these healthchecks.
x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  # ---------------------------------------------------------------- infrastructure

  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT: in-network (kafka:29092); PLAINTEXT_HOST: from the host (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker: every internal topic has replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.4.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./infra/kafka/create-topics.sh:/infra/kafka/create-topics.sh:ro
    entrypoint: ["sh", "/infra/kafka/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:18.6
    container_name: postgres
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: pix
      POSTGRES_PASSWORD: pix
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix -d payments"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka-connect:
    image: quay.io/debezium/connect:3.7.1.Final
    container_name: kafka-connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: kafka-connect
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      # Single broker: Connect's internal topics need replication factor 1.
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Commit source offsets every 5s (default 60s). Delivery is at-least-once:
      # a crash or broker outage before a flush replays the records since the
      # last flush, and consumers dedupe by event_id.
      OFFSET_FLUSH_INTERVAL_MS: 5000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------------------------------- applications (profile: apps)

  payment-api:
    profiles: [apps]
    build:
      context: ./services/payment-api
    container_name: payment-api
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      SPRING_DATASOURCE_USERNAME: pix
      SPRING_DATASOURCE_PASSWORD: pix
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health > /dev/null 2>&1 || wget -qO- http://localhost:8081/actuator/health > /dev/null 2>&1"]

  connector-init:
    profiles: [apps]
    image: curlimages/curl:8.23.0
    container_name: connector-init
    depends_on:
      kafka-connect:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # payment-api's migrations create the outbox table the connector watches.
      payment-api:
        condition: service_healthy
    environment:
      CONNECT_URL: http://kafka-connect:8083
      CONNECTOR_NAME: payments-outbox
      CONFIG_FILE: /infra/connect/outbox-connector.json
    volumes:
      - ./infra/connect:/infra/connect:ro
    entrypoint: ["sh", "/infra/connect/register-connector.sh"]
    restart: "no"

  simulator:
    profiles: [apps]
    build:
      context: ./services/simulator
    container_name: simulator
    ports:
      - "8082:8082"
    depends_on:
      payment-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      connector-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8082"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_API_BASE_URL: http://payment-api:8081
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health > /dev/null 2>&1 || wget -qO- http://localhost:8082/actuator/health > /dev/null 2>&1"]

  # Consumers: no container_name and no host ports, so they can be scaled with --scale.

  antifraud:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/antifraud/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *consumer-env
      KAFKA_GROUP_ID: antifraud

  notification:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    depends_on: *consumer-depends-on
    environment:
      <<: *consumer-env
      KAFKA_GROUP_ID: notification
      DATABASE_URL: postgres://pix:pix@postgres:5432/notification

  reconciliation:
    profiles: [apps]
    build:
      context: .
      dockerfile: services/reconciliation/Dockerfile
    depends_on: *consumer-depends-on
    environment:
      <<: *consumer-env
      KAFKA_GROUP_ID: reconciliation
      DATABASE_URL: postgres://pix:pix@postgres:5432/reconciliation

  # ---------------------------------------------------------------- experiments (profile: experiments)

  # One-shot tooling container for the failure experiments (experiments/README.md):
  #   docker compose --profile experiments run --rm experiments help
  # It drives the stack through the Docker socket, so it can stop Kafka or kill
  # a consumer. Acceptable for a local study project only.
  experiments:
    profiles: [experiments]
    build:
      context: ./experiments
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PGHOST: postgres
      PGUSER: pix
      PGPASSWORD: pix
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    restart: "no"

volumes:
  kafka-data:
  postgres-data:
